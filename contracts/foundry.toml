[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read-write", path = "../deployments" }, { access = "read-write", path = "../receipts" }]

[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
arb_sepolia = "${ARB_SEPOLIA_RPC}"

[etherscan]
arb_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }

[fmt]
line_length = 100

[profile.ci]
fuzz = { runs = 1000 }
verbosity = 3

# deploy scripts hold many locals; IR pipeline only for script runs (tests/coverage stay legacy)
[profile.deploy]
via_ir = true
