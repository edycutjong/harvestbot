name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  # ── STAGE 1: Solidity quality (fmt · build · tests · coverage) ──────────────
  solidity:
    name: "Stage 1 · Solidity (Foundry)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Format check
        run: forge fmt --check
      - name: Build (with sizes)
        run: forge build --sizes
      - name: Tests
        run: forge test -vvv
      - name: Gas snapshot gate (perf — fails on >2% regression, fuzz excluded)
        run: forge snapshot --no-match-test testFuzz --check --tolerance 2
      - name: Coverage
        run: forge coverage --report summary --report lcov --no-match-coverage "(script|test)" | tee coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: solidity-coverage
          path: |
            contracts/coverage.txt
            contracts/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # ── STAGE 1: Stylus quality (fmt · clippy · WASM build · unit tests) ────────
  stylus:
    name: "Stage 1 · Stylus (Rust → WASM) · ${{ matrix.crate }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [stylus/spike, stylus/ledger]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests (native)
        run: cargo test
      - name: WASM release build
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Install cargo-stylus
        run: cargo install cargo-stylus --version 0.10.7 --locked
      - name: cargo stylus check (activation dry-run against Arbitrum Sepolia)
        run: cargo stylus check --endpoint https://sepolia-rollup.arbitrum.io/rpc
        continue-on-error: true # public RPC; advisory in CI, gating locally

  scripts:
    name: "Stage 1 · Scripts (ruff · shellcheck)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: scripts
      - run: ruff format --check scripts
      - name: shellcheck
        run: shellcheck scripts/*.sh

  # ── STAGE 2: Security (parallel) ────────────────────────────────────────────
  slither:
    name: "Stage 2 · Slither (SAST)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: contracts/
          slither-args: --filter-paths "lib/" --exclude-dependencies
          sarif: results.sarif
          fail-on: medium
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.slither.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

  secret-scan:
    name: "Stage 2 · Secret scan (TruffleHog, verified only)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.9
        with:
          extra_args: --only-verified

  readiness:
    name: "Stage 2 · Submission readiness (judged surfaces vs receipts)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_submission_readiness.py

  # ── STAGE 3: Gate ───────────────────────────────────────────────────────────
  gate:
    name: "Stage 3 · All gates"
    needs: [solidity, stylus, scripts, slither, secret-scan, readiness]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - run: |
          echo "✅ Solidity: fmt · build · tests · coverage"
          echo "✅ Stylus:   fmt · clippy · tests · wasm build"
          echo "✅ Gas:      snapshot within 2%"
          echo "✅ Scripts:  ruff · shellcheck"
          echo "✅ Slither:  no medium+ findings"
          echo "✅ Secrets:  none verified in history"
          echo "✅ Ready:    judged surfaces match receipts"
