version: 2
updates:
  - package-ecosystem: "cargo"
    directories: ["/stylus/ledger", "/stylus/spike"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      # Deployed bytecode on 46630 was compiled against these exact commits; a bump changes
      # what `forge build` reproduces. Security alerts still fire; bumps are a deliberate redeploy.
      - dependency-name: "contracts/lib/openzeppelin-contracts"
      - dependency-name: "contracts/lib/forge-std"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Major action bumps are migrations, not maintenance — never unattended on a frozen submission.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
