<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
     aria-label="HarvestBot: on a ledger page the two highest-basis lot lines are struck through in green ink, then an amber hold stamp lands across the rebuy line and stays">
<!-- STORYBOARD (dur 6s, this file's single master dur)
  0-12%   steady state: paper plate, red double margin, green ruling, three graphite lot bars. Poster-complete.
  12-40%  trigger: the harvest confirms; the top lot line, then the second, are struck in green ink.   data-story="beat-2"
  40-55%  mechanism: Nine high-basis lots struck through in green ink; an amber stamp walls the way back until 15 Oct.   data-story="beat-3"
  55-94%  resolution: strikes and stamp persist (held state).   data-story="beat-4"
  94-100% seam: story layer fades; loop restarts on the poster.
-->
