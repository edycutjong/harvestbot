<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img"
     aria-label="HarvestBot: the tax-lot ledger on Robinhood Chain. Nine high-basis AMZN lots are struck through in green ink one by one and carried to a banked total of (24.53 dollars); then an amber stamp walls the rebuy until 15 Oct 2026. 2.87x less L2 gas on Stylus at 64 lots.">
<!-- STORYBOARD (dur 8s, this file's single master dur)
  0-10%   steady state: the pad (paper, green ruling, red double margin), outlined wordmark, tagline, metric, and the open lot table in graphite. Poster-complete.
  10-45%  trigger: the harvest confirms (beat 1, tx 0x689c4d34). HIFO order: lot 63, 62, 61, 60, then 59 to 55 are struck, one line at a time.   data-story="beat-2"
  45-62%  mechanism: Nine high-basis lots struck through in green ink; an amber stamp walls the way back until 15 Oct.   data-story="beat-3"
  62-94%  resolution: the banked total stays double-underlined and the stamp stays across the rebuy line (held state, rule 7).   data-story="beat-4"
  94-100% seam: the story layer fades out and the loop restarts on the poster (rule 5).
-->
